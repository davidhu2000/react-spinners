    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <meta name="title" content="React Spinners" />
    <meta name="description" content="A collection of react loading spinners" />
    <!-- SEO Meta Tags -->
    <meta
      name="keywords"
      content="react, loading spinners, react components, loading animations, react-spinners, javascript, npm package"
    />
    <meta name="author" content="David Hu" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="React Spinners" />
    <meta property="og:description" content="A collection of react loading spinners" />

    <meta property="og:url" content="https://www.davidhu.io/react-spinners/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="React Spinners" />
    <meta name="twitter:description" content="A collection of react loading spinners" />
    <meta name="theme-color" content="#0a0c11" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <noscript>
      <style>
        /* The controls need JavaScript, so don't leave a dead bar behind. */
        .controls {
          display: none;
        }
      </style>
    </noscript>

    <script>
      // Applied before first paint so the theme never flashes.
      (function () {
        try {
          var stored = localStorage.getItem("react-spinners-theme");
          document.documentElement.dataset.theme =
            stored || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>

  <!--
    The chrome below is static so it paints before the bundle runs. React owns
    only the three mount points: the theme toggle, the install command, and the
    controls and grid in #root.
  -->
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="wordmark" href="#top">react-spinners</a>

        <nav class="topbar-links">
          <a href="storybook">Storybook</a>
          <a
            class="icon-button"
            href="https://github.com/davidhu2000/react-spinners"
            aria-label="react-spinners on GitHub"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path
                d="M12 1.5a10.5 10.5 0 0 0-3.32 20.47c.53.1.72-.23.72-.5v-1.8c-2.92.64-3.54-1.4-3.54-1.4-.48-1.23-1.17-1.55-1.17-1.55-.95-.66.07-.64.07-.64 1.06.07 1.61 1.09 1.61 1.09.94 1.6 2.46 1.14 3.06.87.1-.68.37-1.14.67-1.4-2.33-.27-4.78-1.17-4.78-5.2 0-1.15.4-2.09 1.08-2.83-.11-.27-.47-1.34.1-2.8 0 0 .88-.28 2.88 1.08a10 10 0 0 1 5.24 0c2-1.36 2.88-1.08 2.88-1.08.57 1.46.21 2.53.1 2.8.68.74 1.08 1.68 1.08 2.83 0 4.04-2.46 4.93-4.8 5.19.38.33.72.97.72 1.96v2.9c0 .28.19.61.73.5A10.5 10.5 0 0 0 12 1.5Z"
              />
            </svg>
          </a>
          <div id="theme-toggle"></div>
        </nav>
      </div>
    </header>

    <main id="top">
      <section class="hero">
        <p class="eyebrow">Zero dependencies · MIT licensed</p>
        <h1><span class="accent-text">React</span> Spinners</h1>
        <p class="hero-sub">Tune the color, size and speed, then copy the JSX.</p>

        <div id="install">
          <div class="install">
            <div class="install-command">
              <code><span class="install-prompt">$</span> npm install react-spinners</code>
            </div>
          </div>
        </div>
      </section>

      <!-- Every loader is listed here at build time, so the page is browsable
           without JavaScript and the grid holds its place until React renders
           over it. The animations themselves need JS: the loaders inject their
           keyframes at runtime. -->
      <div id="root">
        <div class="controls" aria-hidden="true"><div class="controls-inner"></div></div>
        <div class="grid">
          <!-- loader-cards -->
        </div>
      </div>
    </main>

    <footer>
      <div class="footer-inner">
        <span>Built by <a href="https://www.davidhu.io">David Hu</a> · MIT licensed</span>
        <nav>
          <a href="https://github.com/davidhu2000/react-spinners">GitHub</a>
          <a href="https://www.npmjs.com/package/react-spinners">npm</a>
          <a href="https://www.davidhu.io/blog">Blog</a>
          <a href="https://magichour.ai">Magic Hour</a>
        </nav>
      </div>
    </footer>

    <script type="module" src="./index.tsx"></script>
  </body>
</html>
