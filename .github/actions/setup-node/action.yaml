name: setup-node-env

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.x
    - run: npm install --global yarn
      shell: bash
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.x
        cache: "yarn"
    - run: yarn install
      shell: bash
