name: publish

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Read package version
        id: package
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          version="$(node -p "require('./package.json').version")"
          previous_version="$(git show "${BEFORE_SHA}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"

          if [[ "$version" == "$previous_version" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - if: steps.package.outputs.changed == 'true'
        run: node .yarn/releases/yarn-4.18.0.cjs install --immutable
      - if: steps.package.outputs.changed == 'true'
        run: node .yarn/releases/yarn-4.18.0.cjs run lint --max-warnings=0
      - if: steps.package.outputs.changed == 'true'
        run: node .yarn/releases/yarn-4.18.0.cjs run test --runInBand
      - if: steps.package.outputs.changed == 'true'
        run: node .yarn/releases/yarn-4.18.0.cjs run prepare
      - name: Publish package
        if: steps.package.outputs.changed == 'true'
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if [[ "$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null || true)" != "$PACKAGE_VERSION" ]]; then
            npm publish --ignore-scripts
          fi
      - name: Create GitHub release
        if: steps.package.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: gh release view "$TAG" || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
